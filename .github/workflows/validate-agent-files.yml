name: Validate agent files

on:
  pull_request:
    paths:
      - ".github/agents/**"
      - ".github/skills/**"
      - ".github/instructions/**"
      - ".github/scripts/**"
      - ".github/workflows/**"
      - ".github/copilot-instructions.md"
      - "prompts/**"
      - "README.md"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Validate structure, frontmatter, and README consistency
        run: python3 .github/scripts/validate_registry.py

      - name: Check prompts are in sync with their skills
        run: python3 .github/scripts/sync_prompts.py --check

      - name: Lint markdown
        run: >-
          npx --yes markdownlint-cli2@0.23.2
          ".github/**/*.md" "prompts/**/*.md" "README.md"
